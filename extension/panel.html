<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>rulet.tv</title>
  <style>
    :root { color-scheme: light; font: 14px/1.45 system-ui, sans-serif; color: #20252b; background: #f6f7f8; }
    * { box-sizing: border-box; }
    body { min-width: 250px; height: 100vh; margin: 0; display: flex; flex-direction: column; }
    header { padding: 16px; border-bottom: 1px solid #dfe3e7; background: #fff; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    h1 { margin: 0; font-size: 17px; line-height: 1.25; }
    h1 a { color: inherit; text-decoration: none; }
    h1 a:hover { text-decoration: underline; text-underline-offset: .15em; }
    h1 a:focus-visible { outline: 2px solid #5286c7; outline-offset: 2px; border-radius: 2px; }
    #status { margin-top: 7px; color: #606b75; font-size: 12px; }
    #status.connected { color: #187044; }
    #status.disconnected { color: #b42318; }
    button { border: 1px solid #ccd2d8; border-radius: 7px; padding: 6px 9px; background: #fff; color: inherit; font: inherit; cursor: pointer; }
    #messages { flex: 1; overflow-y: auto; padding: 14px 12px; }
    .empty { margin: 20px 8px; color: #717b84; text-align: center; }
    article { margin: 0 0 12px; padding: 10px 11px; border: 1px solid #e0e4e8; border-radius: 10px; background: #fff; overflow-wrap: anywhere; }
    article.user { border-left: 3px solid #5286c7; }
    article.assistant { border-left: 3px solid #4a9b70; }
    .label { margin-bottom: 4px; color: #606b75; font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; }
    time { display: block; margin: 0 0 6px; color: #7a858f; font-size: 11px; font-variant-numeric: tabular-nums; }
    .delay { display: inline-block; margin-top: 7px; color: #65717c; font-size: 11px; }
    footer { padding: 10px 14px; border-top: 1px solid #dfe3e7; background: #fff; color: #68737d; font-size: 11px; }
    #copyState { min-height: 16px; margin-top: 5px; color: #187044; font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div><h1><a href="https://rulet.tv/" target="_blank" rel="noopener noreferrer" title="Открыть rulet.tv в новой вкладке">rulet.tv</a></h1><div id="status">Проверка связи…</div></div>
      <div class="actions">
        <button id="copyDebug" type="button" title="Скопировать версии, настройки, время и историю разговора">Копировать для отладки</button>
        <button id="settings" type="button" title="Настройки разговора">Настройки</button>
      </div>
    </div>
  </header>
  <main id="messages" aria-live="polite"><p class="empty">Здесь появятся распознанные вопросы и ответы.</p></main>
  <footer>Задержка ответа: от распознанного вопроса до первого аудиофрагмента. Отладочная копия включает текст разговора; проверьте её перед отправкой.<div id="copyState" role="status" aria-live="polite"></div></footer>
  <script src="shared.js"></script>
  <script src="panel.js"></script>
</body>
</html>
